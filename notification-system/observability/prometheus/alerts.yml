# Alert rules, evaluated by Prometheus (see http://localhost:9090/alerts; Grafana lists them too).
# There is no Alertmanager in this project, so nothing is sent anywhere: an alert only shows as
# firing. Connecting one (email, Slack, pager) is the next step for a real deployment.
groups:
  - name: notifications
    rules:
      # Book: Ch. 10, "Retry mechanism".
      - alert: DeadLetterQueueNotEmpty
        expr: sum(rabbitmq_queue_messages_ready{queue="dead-letter"}) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Notifications were given up on (or a malformed message arrived)"
          description: "The dead-letter queue holds {{ $value }} message(s). See notifications with status FAILED in Postgres."

      # Book: Ch. 10, "Monitor queued notifications". A growing backlog means more workers are needed.
      - alert: QueueBacklogGrowing
        expr: |
          sum by (queue) (rabbitmq_queue_messages_ready{queue!~".*retry.*|dead-letter"}) > 100
          and
          deriv(sum by (queue) (rabbitmq_queue_messages_ready{queue!~".*retry.*|dead-letter"})[5m:]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Queue {{ $labels.queue }} keeps growing"
          description: "More than 100 messages are waiting and the number is rising: workers are not keeping up. Add workers."

      - alert: ProviderCircuitOpen
        expr: provider_circuit_state == 2
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Provider {{ $labels.provider }} is considered down"
          description: "Its circuit breaker has been open for over a minute; notifications for it are held back."

      - alert: HighFailureRate
        expr: |
          sum(rate(notifications_failed_total[5m]))
            / (sum(rate(notifications_failed_total[5m])) + sum(rate(notifications_sent_total[5m]))) > 0.1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "More than 10% of notifications are failing for good"

      - alert: RedisFailing
        expr: sum(rate(redis_errors_total[5m])) > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Redis calls are failing"
          description: "The template cache is falling back to Postgres and the rate limiter is letting notifications through unchecked."

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.instance }}) cannot be scraped"
