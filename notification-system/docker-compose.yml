services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://notif:notif@postgres:5432/notifications
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://notif:notif@rabbitmq:5672
      RETRY_DELAYS_MS: ${RETRY_DELAYS_MS:-5000,30000,120000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/live"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    build: .
    command: ["node", "dist/worker/main.js"]
    # Scale with: docker compose up -d --scale worker=3
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://notif:notif@postgres:5432/notifications
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://notif:notif@rabbitmq:5672
      # WORKER_QUEUES: sms          # serve only some queues to scale channels independently
      # Override from the shell for demos, e.g. MOCK_LATENCY_MS=3000 docker compose up -d worker
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-50}
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0}
      CLAIM_LEASE_MS: ${CLAIM_LEASE_MS:-60000}
      RETRY_DELAYS_MS: ${RETRY_DELAYS_MS:-5000,30000,120000}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-10000}
      BREAKER_FAILURE_THRESHOLD: ${BREAKER_FAILURE_THRESHOLD:-5}
      BREAKER_COOLDOWN_MS: ${BREAKER_COOLDOWN_MS:-30000}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      api: { condition: service_healthy } # the api applies the migrations

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notif
      POSTGRES_PASSWORD: notif
      POSTGRES_DB: notifications
    ports:
      - "5432:5432" # exposed so integration tests on the host can reach it
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: notif
      RABBITMQ_DEFAULT_PASS: notif
    ports:
      - "5672:5672" # AMQP, exposed so integration tests on the host can reach it
      - "15672:15672" # management UI, for learning/debugging
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
